  <!-- Structured Data: FAQ (para Google Rich Results) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Qué distancias de atletismo cubre TrainingTrack?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Training Track está diseñado específicamente para medio fondo y fondo, cubriendo desde 400m hasta maratón completo. Incluye: 400m, 800m, 1500m, 3000m, 5000m, 10000m, 5K, 10K, 21K (media maratón) y Maratón (42K)."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo funciona la prueba gratuita?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ofrecemos 30 días de prueba gratuita sin necesidad de tarjeta de crédito. Tendrás acceso completo a todas las características del plan que elijas. Al finalizar el período de prueba, podrás decidir si continuar con una suscripción."
          }
        },
        {
          "@type": "Question",
          "name": "¿Puedo cambiar de plan en cualquier momento?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí, puedes actualizar o cambiar tu plan en cualquier momento. Si actualizas, solo pagarás la diferencia prorrateada. Si cambias a un plan inferior, el cambio se aplicará en tu próximo ciclo de facturación."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué métodos de pago aceptan?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Aceptamos todas las tarjetas de crédito principales (Visa, Mastercard, American Express), Stripe y transferencias bancarias para planes Enterprise. Todos los pagos son procesados de forma segura."
          }
        },
        {
          "@type": "Question",
          "name": "¿Los atletas también necesitan una suscripción?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No, los atletas no pagan nada. Solo el entrenador necesita una suscripción. Los atletas reciben acceso gratuito a la app para ver sus entrenamientos, progreso y comunicarse con su entrenador."
          }
        },
        {
          "@type": "Question",
          "name": "¿Puedo exportar mis datos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí, en los planes Professional y Enterprise puedes exportar todos tus datos en formatos CSV y PDF. Esto incluye entrenamientos, análisis de rendimiento, estadísticas y progreso de atletas."
          }
        },
        {
          "@type": "Question",
          "name": "¿Está disponible en móvil?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí, Training Track está completamente optimizado para dispositivos móviles a través del navegador web. Es una PWA instalable directamente desde el navegador sin pasar por el App Store ni Google Play."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué tipo de soporte ofrecen?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El plan Starter incluye soporte por email con respuesta en 24-48 horas. Professional incluye soporte prioritario 24/7 por email y chat. Enterprise incluye un gestor de cuenta dedicado y soporte telefónico."
          }
        },
        {
          "@type": "Question",
          "name": "¿Puedo usar TrainingTrack para un equipo o club?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutamente. El plan Enterprise está diseñado específicamente para clubes y organizaciones. Permite múltiples entrenadores, atletas ilimitados, y personalización completa con tu marca."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué pasa si cancelo mi suscripción?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Puedes cancelar en cualquier momento sin penalización. Mantendrás acceso completo hasta el final de tu período de facturación actual. Tus datos se conservan durante 90 días por si decides regresar."
          }
        }
      ]
    }
