  <!-- Structured Data: FAQ (para Google Rich Results) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿TrainingTrack es gratuito?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí, durante la fase beta el acceso es completamente gratuito con todas las funcionalidades incluidas. No se requiere tarjeta de crédito."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué incluyen los informes IA semanales?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Cada lunes la IA genera automáticamente un informe por atleta con ACWR (ratio carga aguda/crónica), TSB (balance de fatiga), RPE medio, carga interna (Foster), kilómetros reales desde Strava, alertas de sobreentrenamiento y 4 recomendaciones concretas para la semana siguiente. Si hay competición próxima, incluye predicción de estado de forma."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo funciona la integración con Strava?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Los atletas conectan su cuenta de Strava con un clic. Las actividades se sincronizan automáticamente: distancia, tiempo, ritmo y frecuencia cardíaca aparecen en el dashboard. Cuando el atleta completa una actividad en Strava que coincide con una sesión planificada, se marca como completada automáticamente."
          }
        },
        {
          "@type": "Question",
          "name": "¿Para qué disciplinas y distancias es útil TrainingTrack?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "TrainingTrack está diseñado para atletismo de fondo y medio fondo: desde 800 metros hasta maratón y trail. El predictor de tiempos usa tests VAM y Conconi para estimar marcas en 5K, 10K, media maratón y maratón."
          }
        },
        {
          "@type": "Question",
          "name": "¿Puedo usar TrainingTrack en el móvil?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. TrainingTrack es una aplicación web instalable directamente desde el navegador (sin pasar por el App Store ni Google Play). En iOS, abre Safari y pulsa 'Añadir a pantalla de inicio'. En Android, usa Chrome y pulsa 'Instalar app'. Quedará en tu pantalla de inicio como cualquier app nativa."
          }
        }
      ]
    }
