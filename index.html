  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Qué distancias de atletismo cubre Training Track?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Training Track está diseñado específicamente para medio fondo y fondo, cubriendo desde 400m hasta maratón completo. Incluye: 400m, 800m, 1500m, 3000m, 5000m, 10000m, 5K, 10K, 21K (media maratón) y Maratón (42K)."
          }
        },
        {
          "@type": "Question",
          "name": "¿Puedo usar TrainingTrack sin entrenador?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí, completamente. Si entrenas de forma independiente puedes usar TrainingTrack con Hermes IA como tu entrenador virtual. Hermes genera un plan personalizado basado en tu perfil, objetivo y disponibilidad, y puedes consultarle dudas sobre tu entrenamiento en cualquier momento."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué incluye el plan gratuito para atletas independientes?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El plan gratuito incluye 1 generación de plan de entrenamiento con IA, métricas básicas de rendimiento y seguimiento de competiciones. Es perfecto para probar la plataforma sin ningún coste. Para regeneraciones semanales del plan, chat ilimitado con Hermes IA y conexión con Strava, puedes pasarte al plan Premium por solo 5 €/mes."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo genera la IA mi plan de entrenamiento?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Hermes IA analiza tu perfil completo: distancia objetivo, nivel actual, días disponibles por semana, historial de kilómetros y próximas competiciones. Con esa información genera un plan periodizado con sesiones diarias adaptadas a ti. Si conectas Strava, el plan también tiene en cuenta tu carga reciente para evitar el sobreentrenamiento."
          }
        },
        {
          "@type": "Question",
          "name": "¿Necesito un reloj deportivo o GPS?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No es obligatorio. Puedes usar TrainingTrack desde el móvil sin ningún dispositivo adicional. Sin embargo, si conectas Strava tus actividades se sincronizan automáticamente y las métricas de carga (ACWR, TSB) se calculan con datos reales, lo que mejora mucho la precisión de tu seguimiento."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo funciona la prueba gratuita?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ofrecemos 30 días de prueba gratuita sin necesidad de tarjeta de crédito. Tendrás acceso completo a todas las características del plan que elijas. Al finalizar el período de prueba, podrás decidir si continuar con una suscripción."
          }
        },
        {
          "@type": "Question",
          "name": "¿Puedo cambiar de plan en cualquier momento?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí, puedes actualizar o cambiar tu plan en cualquier momento. Si actualizas, solo pagarás la diferencia prorrateada. Si cambias a un plan inferior, el cambio se aplicará en tu próximo ciclo de facturación."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué métodos de pago aceptan?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Aceptamos todas las tarjetas de crédito principales (Visa, Mastercard, American Express) y Stripe. Todos los pagos son procesados de forma segura."
          }
        },
        {
          "@type": "Question",
          "name": "¿Los atletas con entrenador también necesitan suscripción?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Los atletas que trabajan con un entrenador en TrainingTrack no pagan nada. Solo el entrenador necesita suscripción. Los atletas acceden gratis a la app para ver sus entrenamientos, progreso y comunicarse con su entrenador. Los atletas independientes (sin entrenador) pueden usar el plan gratuito o el Premium por 5 €/mes."
          }
        },
        {
          "@type": "Question",
          "name": "¿Puedo exportar mis datos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí, en los planes Professional y Enterprise puedes exportar todos tus datos en formatos CSV y PDF. Esto incluye entrenamientos, análisis de rendimiento, estadísticas y progreso de atletas."
          }
        },
        {
          "@type": "Question",
          "name": "¿Está disponible en móvil?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí, Training Track está completamente optimizado para dispositivos móviles a través del navegador web. Próximamente lanzaremos apps nativas para iOS y Android."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué tipo de soporte ofrecen?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El plan Starter incluye soporte por email con respuesta en 24-48 horas. Professional incluye soporte prioritario 24/7 por email y chat. Enterprise incluye un gestor de cuenta dedicado y soporte telefónico."
          }
        },
        {
          "@type": "Question",
          "name": "¿Puedo usar Training Track para un equipo o club?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutamente. El plan Enterprise está diseñado específicamente para clubes y organizaciones. Permite múltiples entrenadores, atletas ilimitados, y personalización completa con tu marca."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué pasa si cancelo mi suscripción?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Puedes cancelar en cualquier momento sin penalización. Mantendrás acceso completo hasta el final de tu período de facturación actual. Tus datos se conservan durante 90 días por si decides regresar."
          }
        }
      ]
    }
  </script>
