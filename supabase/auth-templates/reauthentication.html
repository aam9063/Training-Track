<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrainingTrack</title>
</head>
<body style="margin:0;padding:0;background-color:#F7F7F8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color:#F7F7F8;padding:20px 0;">
    <tr>
      <td align="center">
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="560" style="background-color:#FFFFFF;border-radius:12px;padding:32px;max-width:560px;">

          <!-- LOGO -->
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <img src="https://lusirdkixfliydimemre.supabase.co/storage/v1/object/public/site-assets/email-logo.png" alt="TrainingTrack" width="140" style="display:block;border:0;">
            </td>
          </tr>

          <!-- HEADING -->
          <tr>
            <td style="padding-bottom:16px;">
              <h1 style="margin:0;font-size:22px;font-weight:700;color:#0A0A0A;line-height:1.3;">C&oacute;digo de verificaci&oacute;n</h1>
            </td>
          </tr>

          <!-- BODY TEXT -->
          <tr>
            <td style="padding-bottom:24px;">
              <p style="margin:0;font-size:15px;line-height:1.6;color:#374151;">Usa este c&oacute;digo para confirmar tu acci&oacute;n:</p>
            </td>
          </tr>

          <!-- TOKEN BLOCK -->
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <div style="background-color:#F3F4F6;border-radius:8px;padding:20px 40px;display:inline-block;">
                <span style="font-family:'Courier New',monospace;font-size:32px;font-weight:700;color:#0A0A0A;letter-spacing:4px;">{{ .Token }}</span>
              </div>
            </td>
          </tr>

          <!-- NOTE -->
          <tr>
            <td style="padding-bottom:24px;">
              <p style="margin:0;font-size:12px;line-height:1.6;color:#6B7280;">El c&oacute;digo expira en 10 minutos. Si no solicitaste este c&oacute;digo, ignora este correo.</p>
            </td>
          </tr>

          <!-- DIVIDER -->
          <tr>
            <td style="padding-bottom:16px;">
              <hr style="border:none;border-top:1px solid #E5E7EB;margin:0;">
            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td align="center">
              <p style="margin:0 0 8px 0;font-size:12px;color:#6B7280;">TrainingTrack &middot; Entrenamiento inteligente para corredores</p>
              <p style="margin:0;font-size:12px;color:#6B7280;">
                <a href="https://trainingtrack.es" style="color:#6B7280;text-decoration:underline;">trainingtrack.es</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
